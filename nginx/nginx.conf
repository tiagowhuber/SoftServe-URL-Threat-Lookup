worker_processes auto;

events {
    worker_connections 8192;
}

http {
    upstream backend {
        # NGINX resolves "app" at startup and on `nginx -s reload`.
        # Docker DNS returns one A record per running replica, so NGINX
        # creates a backend entry for each IP and round-robins across them.
        # Run `docker compose exec nginx nginx -s reload` after `make scale`
        # to pick up new replica IPs without dropping existing connections.
        server app:8080;
        keepalive 128;  # idle keepalive connections per worker to hold open
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # If a backend refuses connection (graceful shutdown draining),
            # retry transparently on another healthy replica.
            proxy_next_upstream         error timeout http_503;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 5s;

            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;

            # Required for upstream keepalive to work.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
